crons:
  - name: card-due-reminders
    description: "Emails the owner at 9am IST if any credit card payment is due within 3 days"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/due-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
